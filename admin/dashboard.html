<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glazeworks Admin Dashboard</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #FFF9F5;
            color: #5D534E;
            padding-top: 80px;
        }
        
        /* Admin Header */
        .admin-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            padding: 1rem 2rem;
            z-index: 1000;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .admin-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .admin-brand h1 {
            font-size: 1.5rem;
            font-weight: 500;
            color: #5D534E;
        }
        
        .admin-actions {
            display: flex;
            gap: 10px;
        }
        
        .admin-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 2px solid rgba(255, 176, 157, 0.3);
            background: rgba(255, 255, 255, 0.8);
            color: #5D534E;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .admin-btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 1);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .admin-btn.logout {
            background: rgba(255, 107, 107, 0.1);
            border-color: rgba(255, 107, 107, 0.3);
            color: #ff6b6b;
        }
        
        /* Dashboard */
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .dashboard-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .dashboard-header h1 {
            font-size: 2.5rem;
            font-weight: 300;
            color: #5D534E;
            margin-bottom: 1rem;
        }
        
        .dashboard-header p {
            color: #8A7D76;
            font-size: 1.1rem;
        }
        
        /* Tabs */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 3rem;
            border-bottom: 2px solid rgba(255, 176, 157, 0.2);
            padding-bottom: 1rem;
        }
        
        .tab-btn {
            padding: 1rem 2rem;
            border: none;
            background: transparent;
            color: #8A7D76;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 15px;
            transition: all 0.3s ease;
        }
        
        .tab-btn:hover {
            background: rgba(255, 176, 157, 0.1);
            color: #5D534E;
        }
        
        .tab-btn.active {
            background: #FFB09D;
            color: white;
        }
        
        /* Tab Content */
        .tab-content {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        
        .tab-content.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Items Grid */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }
        
        .item-card {
            background: rgba(255, 255, 255, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }
        
        .item-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(255, 176, 157, 0.15);
            border-color: #FFB09D;
        }
        
        .item-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 1rem;
            border: 3px solid rgba(255, 255, 255, 0.9);
        }
        
        .item-info h3 {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            color: #5D534E;
        }
        
        .item-info p {
            color: #8A7D76;
            margin-bottom: 0.5rem;
            line-height: 1.5;
        }
        
        .item-price {
            font-size: 1.2rem;
            font-weight: 600;
            color: #FF8A75;
            margin-bottom: 1rem;
        }
        
        .item-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .action-btn {
            flex: 1;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            border: 2px solid;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .edit-btn {
            background: #FFB09D;
            border-color: #FFB09D;
            color: white;
        }
        
        .edit-btn:hover {
            background: #FF8A75;
            border-color: #FF8A75;
            transform: translateY(-2px);
        }
        
        .delete-btn {
            background: rgba(255, 107, 107, 0.1);
            border-color: rgba(255, 107, 107, 0.3);
            color: #ff6b6b;
        }
        
        .delete-btn:hover {
            background: rgba(255, 107, 107, 0.2);
            border-color: #ff6b6b;
            transform: translateY(-2px);
        }
        
        /* Add Item Card */
        .add-item-card {
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.6) 0%, 
                rgba(255, 248, 240, 0.6) 100%);
            border: 2px dashed rgba(255, 176, 157, 0.5);
            border-radius: 20px;
            padding: 3rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .add-item-card:hover {
            border-color: #FFB09D;
            transform: translateY(-5px);
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.8) 0%, 
                rgba(255, 248, 240, 0.8) 100%);
        }
        
        .add-icon {
            font-size: 3rem;
            color: #FFB09D;
            margin-bottom: 1rem;
        }
        
        .add-item-card h3 {
            color: #5D534E;
            margin-bottom: 0.5rem;
        }
        
        .add-item-card p {
            color: #8A7D76;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 25px;
            padding: 2.5rem;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        
        .modal-header h3 {
            color: #5D534E;
            font-size: 1.5rem;
            margin: 0;
        }
        
        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #8A7D76;
            cursor: pointer;
            padding: 0.5rem;
            line-height: 1;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            color: #5D534E;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            border: 2px solid rgba(255, 176, 157, 0.3);
            background: rgba(255, 255, 255, 0.9);
            color: #5D534E;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #FFB09D;
            box-shadow: 0 0 0 3px rgba(255, 176, 157, 0.1);
        }
        
        .modal-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }
        
        .modal-btn {
            flex: 1;
            padding: 1rem;
            border-radius: 12px;
            border: 2px solid;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .save-btn {
            background: #FFB09D;
            border-color: #FFB09D;
            color: white;
        }
        
        .save-btn:hover {
            background: #FF8A75;
            border-color: #FF8A75;
            transform: translateY(-2px);
        }
        
        .cancel-btn {
            background: rgba(255, 255, 255, 0.9);
            border-color: rgba(255, 176, 157, 0.3);
            color: #5D534E;
        }
        
        .cancel-btn:hover {
            background: rgba(255, 176, 157, 0.1);
            border-color: #FFB09D;
        }
        
        .delete-modal-btn {
            background: rgba(255, 107, 107, 0.1);
            border-color: rgba(255, 107, 107, 0.3);
            color: #ff6b6b;
        }
        
        .delete-modal-btn:hover {
            background: rgba(255, 107, 107, 0.2);
            border-color: #ff6b6b;
        }
        
        /* Loading */
        .loading {
            text-align: center;
            padding: 3rem;
            color: #8A7D76;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 176, 157, 0.3);
            border-top-color: #FFB09D;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Admin Header -->
    <header class="admin-header">
        <div class="admin-brand">
            <h1>🥐 Glazeworks Dashboard</h1>
        </div>
        <div class="admin-actions">
            <button class="admin-btn" id="refreshBtn">🔄 Refresh</button>
            <button class="admin-btn logout" id="logoutBtn">🚪 Logout</button>
        </div>
    </header>
    
    <!-- Dashboard -->
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1>Menu Management</h1>
            <p>Edit pastry and drink items in real-time</p>
        </div>
        
        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="pastries">🥐 Pastries</button>
            <button class="tab-btn" data-tab="drinks">☕ Drinks</button>
        </div>
        
        <!-- Pastries Tab -->
        <div id="pastries-tab" class="tab-content active">
            <div id="pastries-container" class="items-grid">
                <!-- Pastries will load here -->
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Loading pastries...</p>
                </div>
            </div>
            <div class="add-item-card" id="addPastryBtn">
                <div class="add-icon">+</div>
                <h3>Add New Pastry</h3>
                <p>Click to add a new pastry item</p>
            </div>
        </div>
        
        <!-- Drinks Tab -->
        <div id="drinks-tab" class="tab-content">
            <div id="drinks-container" class="items-grid">
                <!-- Drinks will load here -->
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Loading drinks...</p>
                </div>
            </div>
            <div class="add-item-card" id="addDrinkBtn">
                <div class="add-icon">+</div>
                <h3>Add New Drink</h3>
                <p>Click to add a new drink item</p>
            </div>
        </div>
    </div>
    
    <!-- Edit/Add Item Modal -->
    <div id="itemModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Edit Item</h3>
                <button class="close-modal" id="closeModal">&times;</button>
            </div>
            <form id="itemForm">
                <input type="hidden" id="itemId">
                <input type="hidden" id="itemType">
                
                <div class="form-group">
                    <label for="itemName">Item Name</label>
                    <input type="text" id="itemName" required>
                </div>
                
                <div class="form-group">
                    <label for="itemDescription">Description</label>
                    <textarea id="itemDescription" required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="itemPrice">Price</label>
                    <input type="text" id="itemPrice" placeholder="$5.50" required>
                </div>
                
                <div class="form-group" id="imageUrlGroup">
                    <label for="itemImage">Image URL</label>
                    <input type="url" id="itemImage" placeholder="https://example.com/image.jpg">
                    <small style="color: #8A7D76; font-size: 0.9rem;">
                        Leave empty for drinks (no image needed)
                    </small>
                </div>
                
                <div class="modal-actions">
                    <button type="submit" class="modal-btn save-btn">Save Changes</button>
                    <button type="button" class="modal-btn delete-modal-btn" id="deleteItemBtn">Delete Item</button>
                    <button type="button" class="modal-btn cancel-btn" id="cancelBtn">Cancel</button>
                </div>
            </form>
        </div>
    </div>
    
        <script>
        // Check authentication
        const token = localStorage.getItem('adminToken');
        if (!token) {
            window.location.href = 'index.html';
        }
        
        // DOM Elements
        const pastriesContainer = document.getElementById('pastries-container');
        const drinksContainer = document.getElementById('drinks-container');
        const itemModal = document.getElementById('itemModal');
        const API_URL = 'http://localhost:5000/api';
        
        // Global variable to store items
        let allItems = [];
        
        // Initialize
        loadMenuItems();
        setupEventListeners();
        
                // Debug: Log all items
        async function debugItems() {
            try {
                const response = await fetch(`${API_URL}/menu-items`);
                const items = await response.json();
                console.log('All items from API:', items);
                
                items.forEach((item, index) => {
                    console.log(`Item ${index}:`, {
                        _id: item._id,
                        name: item.name,
                        type: item.type,
                        has_id: !!item._id
                    });
                });
            } catch (error) {
                console.error('Debug error:', error);
            }
        }
        
        // Call it on load
        debugItems();


        // Load menu items from API
        async function loadMenuItems() {
            try {
                showLoading('pastries-container');
                showLoading('drinks-container');
                
                const response = await fetch(`${API_URL}/menu-items`);
                if (!response.ok) throw new Error('Failed to fetch items');
                
                allItems = await response.json();
                
                const pastries = allItems.filter(item => item.type === 'pastry');
                const drinks = allItems.filter(item => item.type === 'drink');
                
                displayItems(pastries, 'pastries-container');
                displayItems(drinks, 'drinks-container');
            } catch (error) {
                console.error('Error loading items:', error);
                showError('pastries-container', 'Failed to load items. Check server connection.');
                showError('drinks-container', 'Failed to load items. Check server connection.');
            }
        }

                // Save item to API
        async function saveItem(e) {
            e.preventDefault();
            
            const id = document.getElementById('itemId').value;
            const type = document.getElementById('itemType').value;
            const name = document.getElementById('itemName').value.trim();
            const description = document.getElementById('itemDescription').value.trim();
            const price = document.getElementById('itemPrice').value.trim();
            const image = document.getElementById('itemImage').value.trim();
            
            console.log('Saving item - ID:', id, 'Type:', type); // Debug
            
            if (!name || !description || !price) {
                showToast('❌ Please fill in all required fields');
                return;
            }
            
            // Validate price format
            if (!price.startsWith('$')) {
                showToast('❌ Price should start with $ (e.g., $5.50)');
                return;
            }
            
            const itemData = { 
                name, 
                description, 
                price, 
                type,
                ...(type === 'pastry' && image && { image })
            };
            
            try {
                let response;
                
                if (id && id !== 'undefined' && id.length > 5) {
                    // Update existing item
                    console.log('Updating item with ID:', id);
                    response = await fetch(`${API_URL}/menu-items/${id}`, {
                        method: 'PUT',
                        headers: { 
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(itemData)
                    });
                } else {
                    // Add new item
                    console.log('Creating new item');
                    response = await fetch(`${API_URL}/menu-items`, {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(itemData)
                    });
                }
                
                const data = await response.json();
                
                if (response.ok) {
                    closeModal();
                    loadMenuItems();
                    showToast('✅ Item saved successfully!');
                } else {
                    throw new Error(data.error || `Failed to save item: ${response.status}`);
                }
            } catch (error) {
                console.error('Error saving item:', error);
                showToast(`❌ Error: ${error.message}`);
            }
        }
        
        // Show loading state
        function showLoading(containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Loading...</p>
                </div>
            `;
        }
        
        // Show error
        function showError(containerId, message) {
            const container = document.getElementById(containerId);
            container.innerHTML = `
                <div class="loading">
                    <p style="color: #ff6b6b;">❌ ${message}</p>
                </div>
            `;
        }
        
                        // Display items in grid
        function displayItems(items, containerId) {
            const container = document.getElementById(containerId);
            
            if (items.length === 0) {
                container.innerHTML = '<div class="loading"><p>No items found. Add your first item!</p></div>';
                return;
            }
            
            container.innerHTML = items.map(item => {
                if (!item._id) {
                    console.error('Item missing _id:', item);
                    return '';
                }
                
                return `
                <div class="item-card">
                    ${item.image ? `
                        <img src="${item.image}" class="item-image" alt="${item.name}" 
                             onerror="this.src='https://images.unsplash.com/photo-1555507036-ab794f27d2e9?w=400&h=400&fit=crop'">
                    ` : ''}
                    <div class="item-info">
                        <h3>${item.name}</h3>
                        <p>${item.description}</p>
                        <div class="item-price">${item.price}</div>
                        <div class="item-actions">
                            <button class="action-btn edit-btn" onclick="editItem('${item._id}', '${item.type}')">Edit</button>
                            <button class="action-btn delete-btn" onclick="deleteItem('${item._id}', '${item.type}')">Delete</button>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }
        
        // Event Listeners
        function setupEventListeners() {
            // Tab switching
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    
                    btn.classList.add('active');
                    document.getElementById(`${btn.dataset.tab}-tab`).classList.add('active');
                });
            });
            
            // Add item buttons
            document.getElementById('addPastryBtn').addEventListener('click', () => openAddModal('pastry'));
            document.getElementById('addDrinkBtn').addEventListener('click', () => openAddModal('drink'));
            
            // Refresh button
            document.getElementById('refreshBtn').addEventListener('click', () => {
                loadMenuItems();
                showToast('🔄 Items refreshed');
            });
            
            // Logout button
            document.getElementById('logoutBtn').addEventListener('click', () => {
                localStorage.removeItem('adminToken');
                window.location.href = 'index.html';
            });
            
            // Modal
            document.getElementById('closeModal').addEventListener('click', closeModal);
            document.getElementById('cancelBtn').addEventListener('click', closeModal);
            itemModal.addEventListener('click', (e) => {
                if (e.target === itemModal) closeModal();
            });
            
            // Item form
            document.getElementById('itemForm').addEventListener('submit', saveItem);
            document.getElementById('deleteItemBtn').addEventListener('click', confirmDelete);
        }
        
                // Modal Functions
                async function editItem(id, type) {
            console.log('Editing item:', id, type);
            
            if (!id || id === 'undefined') {
                showToast('❌ Error: Item ID is missing');
                return;
            }
            
            try {
                // Use the new endpoint for single item
                const response = await fetch(`${API_URL}/menu-items/id/${id}`);
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || `Server error: ${response.status}`);
                }
                
                const item = await response.json();
                console.log('Item data received:', item);
                
                if (!item || !item._id) {
                    console.error('Invalid response format:', item);
                    throw new Error('Server returned invalid data format');
                }
                
                // Fill the modal with item data
                document.getElementById('modalTitle').textContent = 'Edit Item';
                document.getElementById('itemId').value = item._id;
                document.getElementById('itemType').value = item.type; // Use item.type from server
                document.getElementById('itemName').value = item.name;
                document.getElementById('itemDescription').value = item.description;
                document.getElementById('itemPrice').value = item.price;
                document.getElementById('itemImage').value = item.image || '';
                
                if (item.type === 'drink') {
                    document.getElementById('imageUrlGroup').style.display = 'none';
                } else {
                    document.getElementById('imageUrlGroup').style.display = 'block';
                }
                
                document.getElementById('deleteItemBtn').style.display = 'block';
                itemModal.classList.add('active');
                
            } catch (error) {
                console.error('Error loading item:', error);
                showToast(`❌ Failed to load item: ${error.message}`);
            }
        }
        
        function openAddModal(type) {
            document.getElementById('modalTitle').textContent = `Add New ${type === 'pastry' ? 'Pastry' : 'Drink'}`;
            document.getElementById('itemId').value = '';
            document.getElementById('itemType').value = type;
            document.getElementById('itemName').value = '';
            document.getElementById('itemDescription').value = '';
            document.getElementById('itemPrice').value = '';
            document.getElementById('itemImage').value = '';
            
            if (type === 'drink') {
                document.getElementById('imageUrlGroup').style.display = 'none';
            } else {
                document.getElementById('imageUrlGroup').style.display = 'block';
            }
            
            document.getElementById('deleteItemBtn').style.display = 'none';
            itemModal.classList.add('active');
        }
        
        function closeModal() {
            itemModal.classList.remove('active');
            document.getElementById('itemForm').reset();
            document.getElementById('deleteItemBtn').style.display = 'block';
        }
        
        // Save item to API
        async function saveItem(e) {
            e.preventDefault();
            
            const id = document.getElementById('itemId').value;
            const type = document.getElementById('itemType').value;
            const name = document.getElementById('itemName').value.trim();
            const description = document.getElementById('itemDescription').value.trim();
            const price = document.getElementById('itemPrice').value.trim();
            const image = document.getElementById('itemImage').value.trim();
            
            if (!name || !description || !price) {
                showToast('❌ Please fill in all required fields');
                return;
            }
            
            // Validate price format
            if (!price.startsWith('$')) {
                showToast('❌ Price should start with $ (e.g., $5.50)');
                return;
            }
            
            const itemData = { 
                name, 
                description, 
                price, 
                type,
                ...(type === 'pastry' && image && { image })
            };
            
            try {
                let response;
                let method;
                let url;
                
                if (id) {
                    // Update existing item
                    method = 'PUT';
                    url = `${API_URL}/menu-items/${id}`;
                } else {
                    // Add new item
                    method = 'POST';
                    url = `${API_URL}/menu-items`;
                }
                
                response = await fetch(url, {
                    method: method,
                    headers: { 
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(itemData)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    closeModal();
                    loadMenuItems();
                    showToast('✅ Item saved successfully!');
                } else {
                    throw new Error(data.error || 'Failed to save item');
                }
            } catch (error) {
                console.error('Error saving item:', error);
                showToast(`❌ Error: ${error.message}`);
            }
        }
        
        function confirmDelete() {
            if (confirm('Are you sure you want to delete this item?')) {
                const id = document.getElementById('itemId').value;
                const type = document.getElementById('itemType').value;
                deleteItemRequest(id, type);
            }
        }
        
        async function deleteItemRequest(id, type) {
            try {
                const response = await fetch(`${API_URL}/menu-items/${id}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    closeModal();
                    loadMenuItems();
                    showToast('✅ Item deleted successfully!');
                } else {
                    const data = await response.json();
                    throw new Error(data.error || 'Failed to delete item');
                }
            } catch (error) {
                console.error('Error deleting item:', error);
                showToast(`❌ Error: ${error.message}`);
            }
        }
        
        async function deleteItem(id, type) {
            if (confirm('Are you sure you want to delete this item?')) {
                try {
                    const response = await fetch(`${API_URL}/menu-items/${id}`, {
                        method: 'DELETE'
                    });
                    
                    if (response.ok) {
                        loadMenuItems();
                        showToast('✅ Item deleted successfully!');
                    } else {
                        const data = await response.json();
                        throw new Error(data.error || 'Failed to delete item');
                    }
                } catch (error) {
                    console.error('Error deleting item:', error);
                    showToast(`❌ Error: ${error.message}`);
                }
            }
        }
        
        // Toast notification
        function showToast(message) {
            // Remove existing toast
            const existingToast = document.querySelector('.toast');
            if (existingToast) existingToast.remove();
            
            // Create toast
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = message;
            toast.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: ${message.includes('✅') ? 'rgba(76, 175, 80, 0.9)' : 'rgba(244, 67, 54, 0.9)'};
                color: white;
                padding: 12px 24px;
                border-radius: 10px;
                backdrop-filter: blur(10px);
                z-index: 3000;
                animation: slideIn 0.3s ease;
                box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            `;
            
            document.body.appendChild(toast);
            
            // Auto remove after 3 seconds
            setTimeout(() => {
                toast.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
            
            // Add CSS animations
            if (!document.querySelector('#toast-styles')) {
                const style = document.createElement('style');
                style.id = 'toast-styles';
                style.textContent = `
                    @keyframes slideIn {
                        from { transform: translateX(100%); opacity: 0; }
                        to { transform: translateX(0); opacity: 1; }
                    }
                    @keyframes slideOut {
                        from { transform: translateX(0); opacity: 1; }
                        to { transform: translateX(100%); opacity: 0; }
                    }
                `;
                document.head.appendChild(style);
            }
        }
    </script>
</body>
</html>
