<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glazeworks | Products</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="products-style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>body { opacity: 0; }</style>
    <link rel="icon" type="image/png" href="bar logo.png">
</head>
<body>
<!-- HEADER -->
    <header class="main-header">
        <div class="header-content">
            <!-- To this: -->
            <div class="logo">
                <a href="index.html" class="logo-link">
                    <img src="Glazeworks Logo-transparent.png" 
                        alt="Glazeworks" 
                        class="logo-image">
                </a>
            </div>
            <nav class="header-nav">
                <!-- <a href="index.html" class="nav-link active">Home</a> -->
                <!-- <a href="products.html" class="nav-link">Products</a> -->
                <!-- <a href="about.html" class="nav-link">About</a> -->
                <!-- <a href="contact.html" class="nav-link">Contact</a> -->
            </nav>
            <div class="header-buttons">
                <button class="header-btn secondary" onclick="window.location.href='products.html'">View Selection</button>
                <button class="header-btn" onclick="window.location.href='contact.html'">Visit Us</button>
                <!-- Add this about icon button -->
                <!-- About Image Icon -->
                <button class="header-btn about-image" onclick="window.location.href='about.html'" title="About Glazeworks">
                    <div class="image-icon">
                        <img src="about icon.png" 
                        alt="About Glazeworks" class="icon-img">
                    <div class="image-overlay"></div>
                    </div>
                </button>
            </div>
        </div>
    </header>
    
    <!-- PRODUCTS HERO -->
    <section class="products-hero">
        <div class="products-hero-card">
            <h1 class="products-title">Our Collection</h1>
            <p class="products-subtitle">Artisan pastries & specialty drinks crafted with precision</p>
        </div>
    </section>
    
    <!-- TABS SECTION -->
    <section class="tabs-section">
        <div class="tabs-container">
            <div class="tabs-header">
                <button class="tab-btn active" data-tab="signature">Signature Collection</button>
                <button class="tab-btn" data-tab="drinks">Coffee & Tea</button>
            </div>
            
            <!-- SIGNATURE COLLECTION TAB -->
            <div class="tab-content active" id="signature-tab">
                <div class="products-grid">
                    <!-- Product items will be dynamically added -->
                </div>
            </div>
            
            <!-- DRINKS TAB -->
            <div class="tab-content" id="drinks-tab">
                <div class="drinks-container">
                    <div class="drinks-grid">
                        <!-- Drink items will be dynamically added -->
                    </div>
                </div>
            </div>
        </div>
    </section>
    
    <!-- FOOTER -->
    <footer class="main-footer">
        <p>© 2024 Glazeworks. A Shardkon daughter brand.</p>
        <p>123 Geometry Avenue, Culinary District, CA 90210</p>
    </footer>
    
    <script src="script.js"></script>
    <script src="products-script.js"></script>
    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.body.style.opacity = '1';
            }, 100);
        });
    </script>
</body>
</html>
